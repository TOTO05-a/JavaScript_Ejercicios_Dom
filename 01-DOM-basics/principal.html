<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

        <h1>Empresa Acme</h1>
        <button>Cerrar Secion</button>

    <section>
        <h2>Productos</h2>
        <button id="btnAgregar">Agregar</button>
            <form id="formProducto">
                <input type="text" id="codigo" placeholder="codigo">
                <input type="text" id="nombre" placeholder="nombre">
                <input type="text" id="precio" placeholder="precio">

        <table border="1">
            <thead>
                <tr>
                    <th>Codigo</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">

            </tbody>
        </table>
    </section>
<script src="scriptEduin.js"></script>
